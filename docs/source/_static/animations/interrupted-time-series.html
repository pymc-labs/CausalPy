<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interrupted time series — CausalPy</title>
    <style>
      :root {
  color-scheme: dark;
  --bg: #102331;
  --line: #2a3d4a;
  --muted: #9bb1bf;
  --white: #f0f5f5;
  --accent: #81c240; /* Labs Sphinx theme secondary/logo green. */
  --amber: #ffc278;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: transparent;
  color: var(--white);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    sans-serif;
}
main {
  margin: 0;
  padding: 0;
}
.card {
  background: var(--bg);
  border: 1px solid #213c48;
  border-radius: 20px;
  overflow: hidden;
}
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr) 62px;
  border-bottom: 1px solid var(--line);
}
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
  border: 0;
  background: none;
}
button:focus-visible,
input:focus-visible {
  outline: 3px solid var(--amber);
  outline-offset: -4px;
}
.step {
  position: relative;
  text-align: left;
  padding: 13px 20px 15px;
  border-right: 1px solid var(--line);
  color: var(--muted);
  min-height: 76px;
}
.step small {
  display: block;
  font-size: 10px;
  letter-spacing: 1.8px;
  font-weight: 650;
  margin-bottom: 5px;
}
.step strong {
  font-size: 15px;
  line-height: 1.3;
  font-weight: 620;
}
.step.active {
  background: #172f3b;
  color: var(--white);
}
.step.active small {
  color: var(--accent);
}
.track {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: #233b48;
}
.fill {
  display: block;
  height: 100%;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
}
.play {
  font-size: 19px;
  color: var(--accent);
}
.scene {
  padding: 24px 28px 0;
}
.scene-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.legend {
  display: flex;
  gap: 19px;
  font-size: 12px;
  color: #c6d5dd;
  flex-wrap: wrap;
}
.legend span {
  display: flex;
  align-items: center;
  gap: 7px;
}
.swatch {
  height: 2px;
  width: 20px;
  background: #dce8ec;
  display: inline-block;
}
.swatch.model {
  background: var(--accent);
}
.swatch.impact {
  width: 7px;
  height: 12px;
  background: var(--accent);
}
svg {
  display: block;
  width: 100%;
  overflow: visible;
}
svg text {
  font-family: inherit;
  font-size: 11px;
  fill: var(--muted);
}
.narrative {
  padding: 0 28px 23px;
  display: grid;
  grid-template-columns: 1fr 195px;
  gap: 30px;
  align-items: center;
  min-height: 125px;
}
h2 {
  font-size: 21px;
  letter-spacing: -0.4px;
  margin: 0 0 8px;
}
.description {
  color: #afc2cc;
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
  max-width: 600px;
}
.metric {
  border-left: 1px solid var(--line);
  padding-left: 24px;
}
.metric strong {
  display: block;
  font-size: 34px;
  letter-spacing: -1px;
  color: var(--accent);
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}
.metric span {
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
}
#metric-interval {
  display: block;
  min-height: 1.5em;
  color: var(--white);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.transport {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px 28px;
  border-top: 1px solid var(--line);
  background: #0d1e29;
}
.transport button {
  font-size: 12px;
  color: #c8d8dd;
  white-space: nowrap;
  padding: 7px 0;
}
.transport label {
  font-size: 11px;
  color: var(--muted);
}
input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  height: 3px;
  cursor: pointer;
}
.time {
  font:
    11px ui-monospace,
    monospace;
  color: var(--muted);
  white-space: nowrap;
}
noscript {
  display: block;
  padding: 30px;
  color: #17313b;
}
@media (max-width: 600px) {
  .card {
    border-radius: 14px;
  }
  .steps {
    grid-template-columns: repeat(3, 1fr) 40px;
  }
  .step {
    padding: 12px 10px 14px;
    min-height: 82px;
  }
  .step small {
    font-size: 9px;
    letter-spacing: 1px;
  }
  .step strong {
    font-size: 13px;
  }
  .scene {
    padding: 20px 14px 0;
  }
  .scene-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }
  .legend {
    font-size: 10px;
    gap: 12px;
  }
  .narrative {
    padding: 0 18px 20px;
    grid-template-columns: 1fr;
    gap: 15px;
    min-height: 223px;
  }
  h2 {
    font-size: 19px;
  }
  .description {
    font-size: 13px;
  }
  .metric {
    border-left: 0;
    border-top: 1px solid var(--line);
    padding: 12px 0 0;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .metric strong {
    font-size: 27px;
  }
  .transport {
    padding: 12px 16px;
    gap: 12px;
  }
  .transport label {
    display: none;
  }
}
.swatch.observed {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
}

    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Interrupted time series animation">
        <div class="steps" role="group" aria-label="Animation stages">
          <button class="step active" data-step="0">
            <small>01 / FIT</small><strong>Learn from the past</strong
            ><span class="track"><i class="fill"></i></span>
          </button>
          <button class="step" data-step="1">
            <small>02 / FORECAST</small><strong>Imagine no intervention</strong
            ><span class="track"><i class="fill"></i></span>
          </button>
          <button class="step" data-step="2">
            <small>03 / COMPARE</small><strong>Estimate the impact</strong
            ><span class="track"><i class="fill"></i></span>
          </button>
          <button class="play" id="play" aria-label="Pause animation">Ⅱ</button>
        </div>
        <div class="scene">
          <div class="scene-heading">
            <div class="legend">
              <span><i class="swatch observed"></i>Observed</span
              ><span><i class="swatch model"></i>Model + 94% band</span
              ><span><i class="swatch impact"></i>Impact + 94% interval</span>
            </div>
          </div>
          <svg
            id="chart"
            role="img"
            aria-labelledby="chart-title chart-desc"
          ></svg>
          <svg
            id="impact-chart"
            role="img"
            aria-label="Monthly impact, observed outcome minus counterfactual; with 94% credible error bars; zero means no estimated effect"
          ></svg>
        </div>
        <div class="narrative">
          <div aria-live="polite">
            <h2 id="headline"></h2>
            <p class="description" id="description"></p>
          </div>
          <div class="metric">
            <div class="metric-estimate">
              <strong id="metric">48</strong>
              <span id="metric-interval"></span>
            </div>
            <span id="metric-label"
              >months used to fit<br />the untreated pattern</span
            >
          </div>
        </div>
        <div class="transport">
          <button id="replay" aria-label="Replay from the beginning">
            ↺ Replay</button
          ><label for="scrub">Explore</label
          ><input
            id="scrub"
            aria-label="Animation progress"
            type="range"
            min="0"
            max="24"
            value="0"
            step="0.01"
          /><span class="time" id="time">00 / 24 s</span>
        </div>
      </section>
      <noscript
        >JavaScript is required to play the animation. The accompanying
        documentation explains the fit, forecast and comparison
        stages.</noscript
      >
    </main>

      "use strict";

    .slice(from, to)

    x1: geometry.cut,

    pre = el("clipPath", { id: "pre-clip" }, defs),

    id: "forecast-band",

    fill: "var(--accent)",

    id: "fit",
    d: path(D.prediction, 0, S, y),

  el("path", {
    id: "forecast",
    d: path(D.prediction, S - 1, N, y),
    fill: "none",
    stroke: "var(--accent)",

    "stroke-dasharray": "5 4",
    "clip-path": "url(#post-clip)",

  const prePoints = el("g", { id: "observed-pre" });
  for (let i = 0; i < S; i++)

      "circle",
      { cx: x(i), cy: y(D.observed[i]), r: 2.5, fill: "#ffffff" },
      prePoints,
    );
  const postPoints = el("g", { id: "observed-post" });
  for (let i = S; i < N; i++)

      "circle",
      { cx: x(i), cy: y(D.observed[i]), r: 2.5, fill: "#ffffff" },
      postPoints,
    );

    mobile ? "IMPACT" : "POINTWISE IMPACT",
    L,
    16,
    { "font-size": 9, "letter-spacing": 1 },
    impact,
  );
  label(
    "observed − counterfactual",
    w - R,
    16,
    { "text-anchor": "end", "font-size": 9 },
    impact,
  );
  el(
    "line",
    {
      x1: L,
      x2: w - R,
      y1: iy(0),
      y2: iy(0),
      stroke: "#52707e",
      "stroke-dasharray": "3 4",
    },
    impact,
  );
  label("0", L - 10, iy(0) + 4, { "text-anchor": "end" }, impact);
  el(
    "line",
    {
      x1: geometry.cut,
      x2: geometry.cut,
      y1: 26,
      y2: 90,
      stroke: "#52707e",
      "stroke-dasharray": "4 5",

    impact,

  const idefs = el("defs", {}, impact),
    iclip = el("clipPath", { id: "impact-clip" }, idefs);
  el(
    "rect",
    { id: "impact-reveal", x: x(S) - 5, y: 25, width: 0, height: 70 },
    iclip,
  );
  const bars = el(
    "g",
    { id: "impact-intervals", "clip-path": "url(#impact-clip)" },
    impact,
  );
  for (let i = S; i < N; i++) {
    const barWidth = Math.max(2, ((w - L - R) / (N - 1)) * 0.6);
    el(
      "rect",
      {
        x: x(i) - barWidth / 2,
        y: Math.min(iy(0), iy(D.impact[i])),
        width: barWidth,
        height: Math.abs(iy(0) - iy(D.impact[i])),
        fill: "var(--accent)",
      },
      bars,
    );
    const lower = iy(D.impact_lower[i]),
      upper = iy(D.impact_upper[i]);
    el(
      "line",
      {
        x1: x(i),
        x2: x(i),
        y1: lower,
        y2: upper,
        stroke: "#ffffff",
        "stroke-width": 1.5,
      },
      bars,
    );
  }

  label(
    "The comparison appears in stage 03.",
    L,
    48,
    { id: "impact-placeholder", "font-size": 11 },
    impact,
  );

}
function render() {
