<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interrupted time series — CausalPy</title>
    <style>
      __STYLE__
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Interrupted time series animation">
        <div class="steps" role="group" aria-label="Animation stages">
          <button class="step active" data-step="0">
            <small>01 / FIT</small><strong>Learn from the past</strong
            ><span class="track"><i class="fill"></i></span>
          </button>
          <button class="step" data-step="1">
            <small>02 / FORECAST</small><strong>Imagine no intervention</strong
            ><span class="track"><i class="fill"></i></span>
          </button>
          <button class="step" data-step="2">
            <small>03 / COMPARE</small><strong>Estimate the impact</strong
            ><span class="track"><i class="fill"></i></span>
          </button>
          <button class="play" id="play" aria-label="Pause animation">Ⅱ</button>
        </div>
        <div class="scene">
          <div class="scene-heading">
            <span class="eyebrow">MONTHLY OUTCOME · SYNTHETIC DATA</span>
            <div class="legend">
              <span><i class="swatch observed"></i>Observed</span
              ><span><i class="swatch mint"></i>Model + 94% band</span
              ><span><i class="swatch impact"></i>Impact + 94% interval</span>
            </div>
          </div>
          <svg
            id="chart"
            role="img"
            aria-labelledby="chart-title chart-desc"
          ></svg>
          <svg
            id="impact-chart"
            role="img"
            aria-label="Monthly impact, observed outcome minus counterfactual; with 94% credible error bars; zero means no estimated effect"
          ></svg>
        </div>
        <div class="narrative">
          <div aria-live="polite">
            <h2 id="headline"></h2>
            <p class="description" id="description"></p>
          </div>
          <div class="metric">
            <strong id="metric">48</strong
            ><span id="metric-label"
              >months used to fit<br />the untreated pattern</span
            >
          </div>
        </div>
        <div class="transport">
          <button id="replay" aria-label="Replay from the beginning">
            ↺ Replay</button
          ><label for="scrub">Explore</label
          ><input
            id="scrub"
            aria-label="Animation progress"
            type="range"
            min="0"
            max="24"
            value="0"
            step="0.01"
          /><span class="time" id="time">00 / 24 s</span>
        </div>
      </section>
      <noscript
        >JavaScript is required to play the animation. The accompanying
        documentation explains the fit, forecast and comparison
        stages.</noscript
      >
    </main>
    <script id="data" type="application/json">
      __DATA__
    </script>
    <script>
      __PLAYER__;
    </script>
  </body>
</html>
