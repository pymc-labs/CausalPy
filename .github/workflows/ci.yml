name: ci

on:
  pull_request:
    branches: [main, pymc6_and_pymcmarketing1_migration]
  push:
    branches: [main, pymc6_and_pymcmarketing1_migration]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only supersede pull request builds. A push to main must finish so the commit
  # keeps its Codecov report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security: do not set to true — prevents credential leakage (GitHub Advanced Security).
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run prek on changed files in PRs
        if: github.event_name == 'pull_request'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}
      - name: Run prek on all files on pushes
        if: github.event_name != 'pull_request'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --all-files

  check-environment-yml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security: do not set to true — prevents credential leakage (GitHub Advanced Security).
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Run only the pyproject2conda-yaml prek hook so that the pin (rev),
      # the argument list, and the output path all come from a single source
      # of truth (.pre-commit-config.yaml). This eliminates the dual-pin /
      # duplicated-args drift surface that previously lived in this job.
      - name: Run pyproject2conda via prek hook
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: pyproject2conda-yaml --all-files
      - name: Check environment.yml is in sync with pyproject.toml
        run: |
          if ! git diff --exit-code -- environment.yml; then
            echo "::error::environment.yml is out of sync with pyproject.toml." >&2
            echo "Run 'prek run pyproject2conda-yaml --all-files' locally and commit the regenerated environment.yml." >&2
            exit 1
          fi
          echo "environment.yml is in sync with pyproject.toml"

  test:
    name: Test (Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas-version }})
    runs-on: ubuntu-latest
    # Guard (issue #1117): a wedged run fails as `failure` in minutes instead of
    # being `cancelled` at GitHub's 6h ceiling. Headroom over the observed ~21 min
    # max for this job (incl. cold micromamba-cache solves); tune if legitimately
    # slower runs appear.
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        # Required so the conda env activated by setup-micromamba persists across steps.
        shell: bash -el {0}
    strategy:
      matrix:
        # Exercise the declared pandas floor separately from the pandas 3 line.
        include:
          - python-version: "3.12"
            pandas-version: "3.x"
            pandas-create-arg: "pandas>=3,<4"
          - python-version: "3.14"
            pandas-version: "3.x"
            pandas-create-arg: "pandas>=3,<4"
          - python-version: "3.12"
            pandas-version: "2.3"
            pandas-create-arg: "pandas>=2.3,<3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security: do not set to true — prevents credential leakage (GitHub Advanced Security).
          persist-credentials: false
      - name: Setup micromamba environment
        uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
        with:
          # Pinned: the micromamba binary is resolved at run time, so an
          # unpinned version changes CI behaviour on an untouched branch.
          micromamba-version: 2.9.0-0
          environment-file: environment.yml
          environment-name: CausalPy
          # Pin python to the matrix version. All other deps (including
          # test-only ones) come from environment.yml, regenerated from
          # pyproject.toml's `dev` + `test` extras via pyproject2conda.
          create-args: >-
            python=${{ matrix.python-version }} ${{ matrix.pandas-create-arg }}
          cache-environment: true
          # The cache key must name the pandas leg explicitly, otherwise the
          # 2.3 and 3.x legs on the same Python would share one cached
          # environment and silently test the same pandas twice.
          cache-environment-key: >-
            micromamba-py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}-${{ hashFiles('environment.yml') }}
      - name: Install package
        # --no-deps so pip does not pull pip-built pymc/pytensor on top of the
        # conda-forge ones. Runtime deps come from environment.yml.
        run: pip install --no-deps -e .
      - name: Fingerprint the resolved PyTensor C-cache runtime
        id: pytensor-c-cache-fingerprint
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import pymc
          import pytensor
          from pytensor.link.c.cmodule import GCC_compiler

          cxx = pytensor.config.cxx
          if not cxx:
              raise RuntimeError("PyTensor C cache requires a configured C++ compiler")
          compiler = Path(shutil.which(cxx) or cxx).resolve(strict=True)
          compiler_version = subprocess.run(
              [compiler, "--version"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          with compiler.open("rb") as source:
              compiler_sha256 = hashlib.file_digest(source, "sha256").hexdigest()
          listing = json.loads(
              subprocess.run(
                  ["micromamba", "list", "--json"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )
          # micromamba >= 2.9 wraps the packages in an object; older versions
          # print the bare list.
          packages = listing["packages"] if isinstance(listing, dict) else listing
          runtime = {
              "compiler": {
                  "path": str(compiler),
                  "sha256": compiler_sha256,
                  "version": compiler_version,
              },
              "environment_flags": {
                  name: os.environ.get(name, "")
                  for name in ("CPPFLAGS", "CXXFLAGS", "LDFLAGS")
              },
              "packages": sorted(
                  (
                      {
                          "build": package.get(
                              "build_string", package.get("build", "")
                          ),
                          "channel": package.get("channel", ""),
                          "name": package["name"],
                          "version": package["version"],
                      }
                      for package in packages
                  ),
                  key=lambda package: (
                      package["name"],
                      package["version"],
                      package["build"],
                      package["channel"],
                  ),
              ),
              "platform": {
                  "machine": platform.machine(),
                  "platform": platform.platform(),
                  "python_cache_tag": sys.implementation.cache_tag,
                  "python_version": sys.version,
              },
              "pytensor": {
                  "blas_ldflags": pytensor.config.blas__ldflags,
                  "cxx": cxx,
                  "cxxflags": pytensor.config.gcc__cxxflags,
                  "effective_compile_args": GCC_compiler.compile_args(),
                  "gcc_version": pytensor.config.gcc_version_str,
                  "config_hash": pytensor.config.get_config_hash(),
                  "version": pytensor.__version__,
              },
              "versions": {
                  "numpy": np.__version__,
                  "pandas": pd.__version__,
                  "pymc": pymc.__version__,
              },
          }
          canonical = json.dumps(runtime, sort_keys=True, separators=(",", ":"))
          print(json.dumps(runtime, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(
                  f"digest={hashlib.sha256(canonical.encode()).hexdigest()}\n"
              )
          PY
      - name: Show environment
        run: |
          micromamba list
          python -c "import pymc, pytensor; print('pymc', pymc.__version__); print('blas_ldflags=', pytensor.config.blas__ldflags)"
      - name: Check the resolved pandas matches the matrix leg
        # Guards against a stale cache or a solver backtrack quietly giving this
        # leg the wrong pandas, which would make the 2.3 leg meaningless.
        env:
          EXPECTED_PANDAS: ${{ matrix.pandas-version }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          expected = os.environ["EXPECTED_PANDAS"]
          expected_major, _, expected_minor = expected.partition(".")
          major, minor = pd.__version__.split(".")[:2]
          print(f"resolved pandas {pd.__version__}, matrix leg {expected}")
          assert major == expected_major, (
              f"expected pandas {expected}, got {pd.__version__}"
          )
          if expected_minor != "x":
              assert minor == expected_minor, (
                  f"expected pandas {expected}, got {pd.__version__}"
              )
          PY
      - name: Run doctests
        # -p causalpy.tests.doctest_sampling loads the plugin that mocks
        # pm.sample for doctests (an autouse fixture in causalpy/tests/conftest.py
        # cannot reach doctests collected from causalpy/*.py) and that fails the
        # leg fast if a doctest ever reaches the real MCMC sampler. The old
        # --config-file=causalpy/tests/conftest.py pointed pytest's rootdir at
        # causalpy/tests (a .py file carries no ini config), so it is dropped.
        run: pytest --doctest-modules -p causalpy.tests.doctest_sampling --ignore=causalpy/tests/ causalpy/ --no-cov
      - name: Run extra tests
        run: pytest docs/source/.codespell/test_notebook_to_markdown.py --no-cov
      - name: Run statistical correctness tests
        # CI restores a warm C cache only after these exact reproducibility tests; the manual migration baseline keeps a cold compiledir per capture for its exact raw-draw gate.
        env:
          PYTENSOR_FLAGS: base_compiledir=${{ runner.temp }}/pytensor-correctness
        run: |
          python -c "import pytensor; print('base_compiledir=', pytensor.config.base_compiledir); print('compiledir=', pytensor.config.compiledir)"
          pytest -o addopts='' -m correctness --cov=causalpy --cov-report= --cov-fail-under=0 --no-cov-on-fail
      - name: Restore the PyTensor C-module cache
        id: pytensor-cmodules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pytensor/compiledir_*
          key: >-
            pytensor-cmodules-v1-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}-env${{ hashFiles('environment.yml') }}-src${{ hashFiles('causalpy/**/*.py', 'pyproject.toml') }}-runtime${{ steps.pytensor-c-cache-fingerprint.outputs.digest }}
      - name: Discard a non-exact PyTensor C-module cache restore
        if: steps.pytensor-cmodules-cache.outputs.cache-hit != 'true'
        run: rm -rf ~/.pytensor/compiledir_*
      - name: Run tests
        run: pytest --cov-append --cov-report=xml --no-cov-on-fail
      - name: Save the PyTensor C-module cache
        if: steps.pytensor-cmodules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pytensor/compiledir_*
          key: >-
            pytensor-cmodules-v1-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}-env${{ hashFiles('environment.yml') }}-src${{ hashFiles('causalpy/**/*.py', 'pyproject.toml') }}-runtime${{ steps.pytensor-c-cache-fingerprint.outputs.digest }}
      - name: Check codespell for notebooks
        run: |
          python ./docs/source/.codespell/notebook_to_markdown.py --tempdir tmp_markdown
          codespell
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
          name: py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}
          fail_ci_if_error: false
