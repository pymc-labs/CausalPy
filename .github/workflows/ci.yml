name: ci

on:
  pull_request:
    branches: [main, pymc6_and_pymcmarketing1_migration]
  push:
    branches: [main, pymc6_and_pymcmarketing1_migration]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only supersede pull request builds. A push to main must finish so the commit
  # keeps its Codecov report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security: do not set to true — prevents credential leakage (GitHub Advanced Security).
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        # The local `uv-lock-check` pre-commit hook shells out to `uv lock
        # --check`, so `uv` must be on PATH for this job (hosted pre-commit.ci
        # cannot install arbitrary tools, so that hook is skipped there via
        # the `ci.skip` list in .pre-commit-config.yaml; the dedicated
        # `uv-lock-check` CI job covers it in that case).
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Run prek on changed files in PRs
        if: github.event_name == 'pull_request'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}
      - name: Run prek on all files on pushes
        if: github.event_name != 'pull_request'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --all-files

  check-environment-yml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security: do not set to true — prevents credential leakage (GitHub Advanced Security).
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Run only the pyproject2conda-yaml prek hook so that the pin (rev),
      # the argument list, and the output path all come from a single source
      # of truth (.pre-commit-config.yaml). This eliminates the dual-pin /
      # duplicated-args drift surface that previously lived in this job.
      - name: Run pyproject2conda via prek hook
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: pyproject2conda-yaml --all-files
      - name: Check environment.yml is in sync with pyproject.toml
        run: |
          if ! git diff --exit-code -- environment.yml; then
            echo "::error::environment.yml is out of sync with pyproject.toml." >&2
            echo "Run 'prek run pyproject2conda-yaml --all-files' locally and commit the regenerated environment.yml." >&2
            exit 1
          fi
          echo "environment.yml is in sync with pyproject.toml"

  # Cheap static check only: does not create a uv environment or run tests.
  # Mirrors the conda-side check-environment-yml job above — together they
  # keep both derived artifacts (environment.yml, uv.lock) honest against
  # pyproject.toml without paying to execute anything twice.
  uv-lock-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security: do not set to true — prevents credential leakage (GitHub Advanced Security).
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

  test:
    name: Test (Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas-version }})
    runs-on: ubuntu-latest
    # Guard (issue #1117): a wedged run fails as `failure` in minutes instead of
    # being `cancelled` at GitHub's 6h ceiling. Headroom over the observed ~21 min
    # max for this job (incl. cold uv-cache resolves); tune if legitimately
    # slower runs appear.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        # Exercise the declared pandas floor separately from the pandas 3 line.
        # pandas-group selects one of the two conflicting `[dependency-groups]`
        # in pyproject.toml (`pandas2` / `pandas3`) so a single uv.lock can
        # hold both resolutions.
        include:
          - python-version: "3.12"
            pandas-version: "3.x"
            pandas-group: "pandas3"
          - python-version: "3.14"
            pandas-version: "3.x"
            pandas-group: "pandas3"
          - python-version: "3.12"
            pandas-version: "2.3"
            pandas-group: "pandas2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security: do not set to true — prevents credential leakage (GitHub Advanced Security).
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        # --locked fails instead of silently re-resolving if uv.lock drifts
        # from pyproject.toml. Pandas major version comes from the matrix leg's
        # conflicting dependency group (see pyproject.toml `[tool.uv] conflicts`).
        # `dev` is included alongside `test` because the Type check step below
        # needs mypy, which lives in `dev` (and `lint`), not `test`.
        run: >-
          uv sync --locked --extra test --extra dev --python ${{ matrix.python-version }}
          --group ${{ matrix.pandas-group }}
      - name: Fingerprint the resolved PyTensor C-cache runtime
        id: pytensor-c-cache-fingerprint
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import shutil
          import subprocess
          import sys
          from importlib.metadata import distributions
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import pymc
          import pytensor
          from pytensor.link.c.cmodule import GCC_compiler

          cxx = pytensor.config.cxx
          if not cxx:
              raise RuntimeError("PyTensor C cache requires a configured C++ compiler")
          compiler = Path(shutil.which(cxx) or cxx).resolve(strict=True)
          compiler_version = subprocess.run(
              [compiler, "--version"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          with compiler.open("rb") as source:
              compiler_sha256 = hashlib.file_digest(source, "sha256").hexdigest()
          # uv-resolved package listing (replaces `micromamba list --json`):
          # every distribution importable in the synced venv, name + version.
          packages = [
              {"name": dist.metadata["Name"], "version": dist.version}
              for dist in distributions()
              if dist.metadata.get("Name")
          ]
          runtime = {
              "compiler": {
                  "path": str(compiler),
                  "sha256": compiler_sha256,
                  "version": compiler_version,
              },
              "environment_flags": {
                  name: os.environ.get(name, "")
                  for name in ("CPPFLAGS", "CXXFLAGS", "LDFLAGS")
              },
              "packages": sorted(
                  (
                      {"name": package["name"], "version": package["version"]}
                      for package in packages
                  ),
                  key=lambda package: (package["name"], package["version"]),
              ),
              "platform": {
                  "machine": platform.machine(),
                  "platform": platform.platform(),
                  "python_cache_tag": sys.implementation.cache_tag,
                  "python_version": sys.version,
              },
              "pytensor": {
                  "blas_ldflags": pytensor.config.blas__ldflags,
                  "cxx": cxx,
                  "cxxflags": pytensor.config.gcc__cxxflags,
                  "effective_compile_args": GCC_compiler.compile_args(),
                  "gcc_version": pytensor.config.gcc_version_str,
                  "config_hash": pytensor.config.get_config_hash(),
                  "version": pytensor.__version__,
              },
              "versions": {
                  "numpy": np.__version__,
                  "pandas": pd.__version__,
                  "pymc": pymc.__version__,
              },
          }
          canonical = json.dumps(runtime, sort_keys=True, separators=(",", ":"))
          print(json.dumps(runtime, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(
                  f"digest={hashlib.sha256(canonical.encode()).hexdigest()}\n"
              )
          PY
      - name: Show environment
        run: |
          uv pip list
          uv run --no-sync python -c "import pymc, pytensor; print('pymc', pymc.__version__); print('blas_ldflags=', pytensor.config.blas__ldflags)"
      - name: Check the resolved pandas matches the matrix leg
        # Guards against a stale lock or a solver backtrack quietly giving this
        # leg the wrong pandas, which would make the 2.3 leg meaningless.
        env:
          EXPECTED_PANDAS: ${{ matrix.pandas-version }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import pandas as pd

          expected = os.environ["EXPECTED_PANDAS"]
          expected_major, _, expected_minor = expected.partition(".")
          major, minor = pd.__version__.split(".")[:2]
          print(f"resolved pandas {pd.__version__}, matrix leg {expected}")
          assert major == expected_major, (
              f"expected pandas {expected}, got {pd.__version__}"
          )
          if expected_minor != "x":
              assert minor == expected_minor, (
                  f"expected pandas {expected}, got {pd.__version__}"
              )
          PY
      - name: Type check
        # Runs here rather than in prek because mypy only says anything useful when the real dependencies are importable, and the pre-commit env has none of them (issue #1127). Scope and the per-module allowlist that keeps this green live in [tool.mypy] in pyproject.toml.
        run: uv run --no-sync make typecheck
      - name: Run doctests
        # -p causalpy.tests.doctest_sampling loads the plugin that mocks
        # pm.sample for doctests (an autouse fixture in causalpy/tests/conftest.py
        # cannot reach doctests collected from causalpy/*.py) and that fails the
        # leg fast if a doctest ever reaches the real MCMC sampler. The old
        # --config-file=causalpy/tests/conftest.py pointed pytest's rootdir at
        # causalpy/tests (a .py file carries no ini config), so it is dropped.
        run: uv run --no-sync pytest --doctest-modules -p causalpy.tests.doctest_sampling --ignore=causalpy/tests/ causalpy/ --no-cov
      - name: Run extra tests
        run: uv run --no-sync pytest docs/source/.codespell/test_notebook_to_markdown.py --no-cov
      - name: Run statistical correctness tests
        # CI restores a warm C cache only after these exact reproducibility tests; the manual migration baseline keeps a cold compiledir per capture for its exact raw-draw gate.
        env:
          PYTENSOR_FLAGS: base_compiledir=${{ runner.temp }}/pytensor-correctness
        run: |
          uv run --no-sync python -c "import pytensor; print('base_compiledir=', pytensor.config.base_compiledir); print('compiledir=', pytensor.config.compiledir)"
          uv run --no-sync pytest -o addopts='' -m correctness --cov=causalpy --cov-report= --cov-fail-under=0 --no-cov-on-fail
      - name: Restore the PyTensor C-module cache
        id: pytensor-cmodules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pytensor/compiledir_*
          key: >-
            pytensor-cmodules-v2-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}-lock${{ hashFiles('uv.lock') }}-src${{ hashFiles('causalpy/**/*.py', 'pyproject.toml') }}-runtime${{ steps.pytensor-c-cache-fingerprint.outputs.digest }}
      - name: Discard a non-exact PyTensor C-module cache restore
        if: steps.pytensor-cmodules-cache.outputs.cache-hit != 'true'
        run: rm -rf ~/.pytensor/compiledir_*
      - name: Run tests
        run: uv run --no-sync pytest --cov-append --cov-report=xml --no-cov-on-fail
      - name: Save the PyTensor C-module cache
        if: steps.pytensor-cmodules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pytensor/compiledir_*
          key: >-
            pytensor-cmodules-v2-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}-lock${{ hashFiles('uv.lock') }}-src${{ hashFiles('causalpy/**/*.py', 'pyproject.toml') }}-runtime${{ steps.pytensor-c-cache-fingerprint.outputs.digest }}
      - name: Check codespell for notebooks
        run: |
          uv run --no-sync python ./docs/source/.codespell/notebook_to_markdown.py --tempdir tmp_markdown
          uv run --no-sync codespell
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
          name: py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}
          fail_ci_if_error: false
