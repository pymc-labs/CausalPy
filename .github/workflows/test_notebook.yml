name: Test Notebooks

on:
  pull_request:
    branches: [main, pymc6_and_pymcmarketing1_migration]
    paths:
      - "pyproject.toml"
      - "causalpy/**"
      - ".github/workflows/test_notebook.yml"
      - "scripts/run_notebooks/**"
      - "docs/source/notebooks/**"
      - "docs/source/knowledgebase/**"
  push:
    branches: [main, pymc6_and_pymcmarketing1_migration]
    paths:
      - "pyproject.toml"
      - "causalpy/**"
      - ".github/workflows/test_notebook.yml"
      - "scripts/run_notebooks/**"
      - "docs/source/notebooks/**"
      - "docs/source/knowledgebase/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: gallery-pymc
            collection: gallery
            pattern: "*-pymc.ipynb"
            exclude_one: ""
            exclude_two: ""
          - name: gallery-sklearn
            collection: gallery
            pattern: "*-sklearn.ipynb"
            exclude_one: ""
            exclude_two: ""
          - name: gallery-other
            collection: gallery
            pattern: ""
            exclude_one: "*-pymc.ipynb"
            exclude_two: "*-sklearn.ipynb"
          - name: knowledgebase
            collection: knowledgebase
            pattern: ""
            exclude_one: ""
            exclude_two: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        # This lane intentionally does NOT use `uv sync --locked`: the docs-only
        # PyMC-Marketing transition snapshot pinned in docs/requirements.txt
        # (pymc-extras<0.15, pymc<6.3, pytensor<3.3) conflicts with the floors
        # uv.lock resolves for the rest of the project. `uv venv` + `uv pip
        # install` mirrors today's unlocked pip install sequence instead:
        # docs/requirements.txt first, then the project's test+docs extras,
        # both unlocked so the final resolution matches (not uv.lock).
        run: |
          uv venv --python 3.12
          uv pip install -r docs/requirements.txt
          uv pip install -e ".[test,docs]"

      - name: Run notebooks
        env:
          NOTEBOOK_COLLECTION: ${{ matrix.collection }}
          NOTEBOOK_PATTERN: ${{ matrix.pattern }}
          NOTEBOOK_EXCLUDE_ONE: ${{ matrix.exclude_one }}
          NOTEBOOK_EXCLUDE_TWO: ${{ matrix.exclude_two }}
        run: |
          args=(--collection "$NOTEBOOK_COLLECTION")
          if [[ -n "$NOTEBOOK_PATTERN" ]]; then
            args+=(--pattern "$NOTEBOOK_PATTERN")
          fi
          if [[ -n "$NOTEBOOK_EXCLUDE_ONE" ]]; then
            args+=(--exclude-pattern "$NOTEBOOK_EXCLUDE_ONE")
          fi
          if [[ -n "$NOTEBOOK_EXCLUDE_TWO" ]]; then
            args+=(--exclude-pattern "$NOTEBOOK_EXCLUDE_TWO")
          fi
          uv run --no-sync python scripts/run_notebooks/runner.py "${args[@]}"
