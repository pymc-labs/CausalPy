name: "PR Issue Label Sync"

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited]

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read  # to read labels from linked issues

    steps:
      - name: Sync labels from closing issues
        uses: williambdean/closing-labels@d4408b5fea2f8aa52a35e406d1831cf91399410f # v1.0.1
        with:
          exclude: "help wanted,good first issue"
          respect_unlabeled: true
          fail_on_error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
