[build-system]
# Minimum requirements for the build system to execute.
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

# This is configuration specific to the `setuptools` build backend.
# If you are using a different build backend, you will need to change this.
[tool.setuptools.packages.find]
exclude = ["causalpy.test*", "docs*"]

[tool.setuptools.dynamic]
version = {attr = "causalpy.version.__version__"}

[tool.setuptools.package-data]
"causalpy.data" = ["*.csv"]
"causalpy.templates" = ["*.html"]

[project]
name = "CausalPy"
dynamic = ["version"]
description = "Causal inference for quasi-experiments in Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ben Vincent", email = "ben.vincent@pymc-labs.com" }]
requires-python = ">=3.12"
keywords = ["causal inference", "statistics", "econometrics", "pymc", "bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# This field lists other packages that your project depends on to run.
# Any package you put here will be installed by pip when your project is
# installed, so they must be valid existing projects.
#
# For an analysis of this field vs pip's requirements files see:
# https://packaging.python.org/discussions/install-requires-vs-requirements/
dependencies = [
    "arviz>=1.1,<2",
    "graphviz",
    "ipython!=8.7.0",
    "jinja2",
    "matplotlib>=3.5.3",
    "narwhals>=1.13.1",
    "numpy",
    "pandas>=2.3,<4",
    "patsy",
    "plotnine>=0.15.7",
    "polars",
    # Keep these public major-version ranges broad. PyMC metadata supplies compatible PyTensor patch-level ranges, so base installs may select newer PyMC/PyTensor minors.
    # The docs-only PyMC-Marketing transition snapshot in docs/requirements.txt has its own narrower resolver constraints; it does not restrict normal runtime installs.
    # pymc-extras 0.11 is the first release that declares PyMC 6 support and provides the structural state-space API CausalPy imports.
    "pymc>=6.0.1,<7",
    "pytensor>=3,<4",
    "scikit-learn>=1",
    "scipy",
    "seaborn>=0.11.2",
    "statsmodels",
    "xarray>=v2022.11.0",
    "pymc-extras>=0.11",
]

# List additional groups of dependencies here (e.g. development dependencies). Users
# will be able to install these using the "extras" syntax, for example:
#
#   $ pip install causalpy[dev]
#
# Similar to `dependencies` above, these must be valid existing projects.
[project.optional-dependencies]
# pymc-forecast is young (0.x); pin the minor so API movement across 0.x
# minors is opted into deliberately (see docs on the ITS forecast backend).
# The [extras] marker pulls pymc-extras>=0.10, which upstream declares for
# the Pathfinder integration the adapter advertises.
forecast = [
    "pymc-forecast[extras]>=0.2,<0.3",
]
dev = [
    "prek",
    # Pinned: a type checker that floats turns an untouched branch red whenever upstream ships new checks. Bump deliberately, with the allowlist in [tool.mypy] re-measured (issue #1127). TOML cannot share the value, so the same pin appears in the ``lint`` extra below and the two must be bumped together.
    "mypy==2.3.0",
    "twine",
    "codespell",
    "nbformat",
    "nbconvert",
    "PyYAML",
]
docs = [
    "ipykernel",
    "maketables",
    "daft-pgm",
    "pymc-bart",
    "linkify-it-py",
    "myst-nb<=1.0.0",
    "pylint",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx_autodoc_defaultargs",
    "labs-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-sitemap",
    "statsmodels",
    "sphinxcontrib-bibtex>=2.7.0",
    "sphinx-notfound-page",
    "ipywidgets",
    "sphinx-design",
    "sphinx-togglebutton",
    "nbformat",
    "nbconvert",
    "Pillow",
    "PyYAML",
    "sphinxext-rediraffe",
]
# The mypy pin here must match the one in the ``dev`` extra above; TOML cannot share the value, so bump both together.
lint = ["prek", "ruff", "mypy==2.3.0"]
test = [
    "pytest",
    "pytest-cov",
    "diff-cover",
    "codespell",
    "nbformat",
    "nbconvert",
    "papermill",
    "polars",
    "pyarrow",
    "pymc-forecast[extras]>=0.2,<0.3",
]

[tool.pyproject2conda]
channels = ["conda-forge"]

# pymc-forecast is PyPI-only (not on conda-forge): route it to the pip
# section of the generated environment.yml.
[tool.pyproject2conda.dependencies]
pymc-forecast = { pip = true }

[project.urls]
Homepage = "https://github.com/pymc-labs/CausalPy"
"Bug Reports" = "https://github.com/pymc-labs/CausalPy/issues"
Source = "https://github.com/pymc-labs/CausalPy"
Documentation = "https://causalpy.readthedocs.io"
Changelog = "https://causalpy.readthedocs.io/en/latest/release_notes.html"
Discussions = "https://github.com/pymc-labs/CausalPy/discussions"

[tool.pytest.ini_options]
addopts = [
    "-vv",
    "-m",
    "not correctness",
    "--strict-markers",
    "--strict-config",
    "--cov=causalpy",
    "--cov-report=term-missing",
]
testpaths = "causalpy/tests"
markers = [
    "integration: mark as an integration test.",
    "slow: mark test as slow.",
    "correctness: mark statistical correctness and reproducibility tests.",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Pin explicit rule set (not extend-select) so ruff default expansions do not
# silently add new rule families on version bumps.
select = [
    "E4",  # pycodestyle errors (import)
    "E7",  # pycodestyle errors (statement)
    "E9",  # pycodestyle errors (runtime)
    "F",   # pyflakes - detect unused imports, undefined names
    "I",   # isort
    "B",   # flake8-bugbear - find likely bugs and design problems
    "UP",  # pyupgrade - modern Python syntax upgrades
    "C4",  # flake8-comprehensions - better list/dict comprehensions
    "SIM", # flake8-simplify - suggest simpler code
]

[tool.ruff.lint.per-file-ignores]
# Notebooks display dataframes via bare expressions on the last line of a cell.
"*.ipynb" = ["B018"]

[tool.codespell]
ignore-words = "./docs/source/.codespell/codespell-whitelist.txt"
skip = "*.ipynb,*.csv,*.svg,pyproject.toml,docs/source/.codespell/codespell-whitelist.txt"

# Numpydoc validation. Originally introduced under #886 as a narrow check on public ``.plot`` overrides, expanded under #898 to enforce a curated set of numpydoc rules across the whole ``causalpy`` package. The ``exclude`` regex matches any dotted node whose path contains a private (underscore-prefixed) component — private helpers, dunders, and members of private modules are considered implementation detail and not subject to docstring validation.
[tool.numpydoc_validation]
checks = [
    "PR01",  # Parameters not documented
    "PR02",  # Unknown parameters
    "PR04",  # Parameter has no type
    "PR07",  # Parameter has no description
    "PR10",  # Parameter requires a space before the colon
    "RT03",  # Return value has no description
    "SS03",  # Summary does not end with a period
    "GL07",  # Sections are in the wrong order
    "GL08",  # Object does not have a docstring
]
exclude = ['\._']

[tool.coverage.run]
source = ["causalpy"]
omit = ["*/conftest.py", "*/tests/conftest.py"]
branch = true  # Also measure branch coverage, not just line coverage

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Type checking (issue #1127). ``files = "causalpy"`` recurses, so the subpackages are covered; the old ``causalpy/*.py`` glob did not and only reached the 18 top-level modules. ``make typecheck`` runs this from the project environment, where the real dependencies are importable, and CI runs the same target. ``ignore_missing_imports`` drops the untyped-third-party noise (pymc, patsy, arviz and friends ship no stubs).
[tool.mypy]
files = "causalpy"
exclude = "build|dist|docs|notebooks|tests|setup.py"
ignore_missing_imports = true
# Report an override below that stops matching a real module, so a rename or a deletion does not leave a stale allowlist entry behind unnoticed. This warns rather than fails: mypy prints ``note: unused section(s)`` and still exits 0, so it surfaces the staleness in the log without turning the gate red on its own.
warn_unused_configs = true

# Allowlist of modules that already fail, so the gate starts green and ratchets down (49 errors in 16 files, measured on pymc6_and_pymcmarketing1_migration at 194343ca). Each entry disables only the error codes that module actually produces, so everything else is still checked there. Removing an entry, or a single code from one, is a self-contained follow-up PR.
[[tool.mypy.overrides]]
module = "causalpy.experiments.inverse_propensity_weighting"
disable_error_code = ["arg-type", "assignment", "index", "return-value"]

[[tool.mypy.overrides]]
module = [
    "causalpy.experiments.instrumental_variable",
    "causalpy.experiments.prepostnegd",
    "causalpy.experiments.regression_discontinuity",
    "causalpy.experiments.regression_kink",
    "causalpy.reporting",
]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = [
    "causalpy.experiments.interrupted_time_series",
    "causalpy.experiments.staggered_did",
    "causalpy.experiments.synthetic_control",
    "causalpy.experiments.synthetic_difference_in_differences",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "causalpy.experiments.diff_in_diff"
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = "causalpy.experiments.panel_regression"
disable_error_code = ["attr-defined", "index"]

[[tool.mypy.overrides]]
module = "causalpy.checks.operating_characteristics"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = "causalpy.plot_utils"
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "causalpy.pymc_models"
disable_error_code = ["call-overload", "return-value"]

[[tool.mypy.overrides]]
module = "causalpy._arviz_compat"
disable_error_code = ["type-var"]

[tool.marimo.runtime]
watcher_on_save = "autorun"

# PyMarkdown linter (pre-commit hook) configuration. Primary motivator (issue #899) is enforcing MD032 — lists must be surrounded by blank lines — to mirror the docstring rule already enforced by ``validate-docstring-lists`` (issue #892). The rules below are deliberately disabled because they conflict with project conventions or are noisy on the existing Markdown corpus (see PR #900 for the audit).
[tool.pymarkdown]
# Enable GitHub-flavoured / front-matter extensions so the linter understands YAML front-matter (cursor agent / skill files), GFM task lists, tables, strikethrough, and extended autolinks.
extensions.front-matter.enabled = true
extensions.markdown-task-list-items.enabled = true
extensions.markdown-tables.enabled = true
extensions.markdown-strikethrough.enabled = true
extensions.markdown-extended-autolinks.enabled = true
# Project convention: do not hard-wrap Markdown lines (see AGENTS.md).
plugins.md013.enabled = false
# Many top-level docs (skills, agent definitions, command snippets) start with YAML front-matter or a short paragraph rather than an H1.
plugins.md041.enabled = false
# Allow a mix of setext and atx headings across files.
plugins.md003.enabled = false
# Allow ``1.  item`` style list-marker spacing produced by some editors.
plugins.md030.enabled = false
# Allow varying unordered-list indentation.
plugins.md007.enabled = false
# Skill / agent description lines naturally end in punctuation when promoted to headings by the renderer.
plugins.md026.enabled = false
# Bold text used as pseudo-headings is an established pattern in skill files.
plugins.md036.enabled = false
# Templates and reference docs intentionally repeat heading text.
plugins.md024.enabled = false
# Inline HTML (e.g. ``<details>`` blocks) is occasionally used in long-form docs.
plugins.md033.enabled = false
# Shell-prompt prefixes (``$ cmd``) are useful in setup instructions.
plugins.md014.enabled = false
# Image alt text is enforced in notebooks separately; .md image usage is rare.
plugins.md045.enabled = false
